<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capas sensoriales de la mosca</title>
<script>try { const m = localStorage.getItem("capas-modo"); if (m === "light" || m === "dark") document.documentElement.dataset.modo = m; } catch (e) {}</script>
<style>
/* Estilo tomado de kanmachi.co.jp: banda beige arriba, secciones blancas, pie oscuro; títulos en Outfit en mayúsculas
   y terracota; botones redondos; bandas beige separadas por líneas blancas; marcos de esquinas; puntos de énfasis.
   La barra de cuadros de color es aquí la escala de capas (1 tinta → 11 durazno) y los anillos, la señal que se propaga.
   Layout: banda (título + selector); primera pantalla = capa por superclase (2/3) + motoneuronas (1/3); abajo, atajo,
   dos moscas y tipos, cada una a todo lo ancho. */
:root {
  --beige: #e5dcd2; --surface: #ffffff; --block: #efe8df; --ink: #231f1e; --muted: #6b5d55;
  --terra: #c57b57; --terra-txt: #8a4a2e; --ctl: #a0624a; --hair: #e5dcd2; --linea: #231f1e;
  --fw: #e60012; --banc: #231f1e; --pata: #f39800; --azar: #8c8580; --mediana: #ffffff;
  --pie: #231f1e; --pie-txt: #e5dcd2; --rombo: #e60012;
  --c1: #231f1e; --c2: #4a2e26; --c3: #7a2a1c; --c4: #b8141a; --c5: #e60012; --c6: #c57b57; --c7: #dc892b;
  --c8: #f39800; --c9: #f7b64a; --c10: #f9cb7f; --c11: #fbe3b8;
  --en: "Outfit", "Helvetica Neue", Arial, sans-serif;
  --jp: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Helvetica Neue", Arial, sans-serif;
  --f1: .8rem; --f2: .875rem; --f3: 1rem; --f4: 1.125rem; --f5: 1.375rem; --f6: 1.75rem;
  --r1: 6px; --r2: 12px; --r3: 24px; --pill: 999px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --beige: #2d2826; --surface: #231f1e; --block: #2d2826; --ink: #f4efe9; --muted: #b9ada2;
    --terra: #e3a07f; --terra-txt: #e3a07f; --ctl: #8f847c; --hair: #3a3330; --linea: #f4efe9;
    --fw: #ff5a5f; --banc: #f4efe9; --pata: #ffb347; --azar: #8f847c; --mediana: #231f1e;
    --pie: #171413; --pie-txt: #d9cfc4; --rombo: #ff5a5f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --beige: #2d2826; --surface: #231f1e; --block: #2d2826; --ink: #f4efe9; --muted: #b9ada2;
  --terra: #e3a07f; --terra-txt: #e3a07f; --ctl: #8f847c; --hair: #3a3330; --linea: #f4efe9;
  --fw: #ff5a5f; --banc: #f4efe9; --pata: #ffb347; --azar: #8f847c; --mediana: #231f1e;
  --pie: #171413; --pie-txt: #d9cfc4; --rombo: #ff5a5f;
  color-scheme: dark;
}

/* botón de tema de la página: data-modo gana a data-theme y al tema del sistema por orden (misma especificidad) */
:root[data-modo="light"] {
  --beige: #e5dcd2; --surface: #ffffff; --block: #efe8df; --ink: #231f1e; --muted: #6b5d55;
  --terra: #c57b57; --terra-txt: #8a4a2e; --ctl: #a0624a; --hair: #e5dcd2; --linea: #231f1e;
  --fw: #e60012; --banc: #231f1e; --pata: #f39800; --azar: #8c8580; --mediana: #ffffff;
  --pie: #231f1e; --pie-txt: #e5dcd2; --rombo: #e60012;
  --c1: #231f1e; --c2: #4a2e26; --c3: #7a2a1c; --c4: #b8141a; --c5: #e60012; --c6: #c57b57; --c7: #dc892b;
  --c8: #f39800; --c9: #f7b64a; --c10: #f9cb7f; --c11: #fbe3b8;
  color-scheme: light;
}
:root[data-modo="dark"] {
  --beige: #2d2826; --surface: #231f1e; --block: #2d2826; --ink: #f4efe9; --muted: #b9ada2;
  --terra: #e3a07f; --terra-txt: #e3a07f; --ctl: #8f847c; --hair: #3a3330; --linea: #f4efe9;
  --fw: #ff5a5f; --banc: #f4efe9; --pata: #ffb347; --azar: #8f847c; --mediana: #231f1e;
  --pie: #171413; --pie-txt: #d9cfc4; --rombo: #ff5a5f;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--surface); }
body { margin: 0; background: var(--surface); color: var(--ink); font: 500 var(--f3)/1.8 var(--jp); letter-spacing: .03em; }
.envoltura { max-width: 1280px; margin-inline: auto; padding-inline: clamp(16px, 3.5vw, 48px); }
a { color: inherit; }
button, input, select { font: inherit; color: inherit; letter-spacing: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
h1, h2 { margin: 0; text-wrap: balance; }
.nota, .fig-l, .glabel, dt, .lead { color: var(--muted); }
.nota { font-size: var(--f2); }

/* ---------- banda superior */
.banda-top { background: var(--beige); position: relative; overflow: hidden; }
.top { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 22px; align-items: center; padding-top: 12px; padding-bottom: 6px; position: relative; z-index: 1; }
.sello { width: 88px; height: 88px; }
.sello svg { width: 100%; height: 100%; animation: girar 28s linear infinite; overflow: visible; }
.sello text { font: 600 11.6px var(--en); letter-spacing: .14em; fill: var(--ink); }
@keyframes girar { to { transform: rotate(360deg); } }
.kicker { margin: 0; font: 600 var(--f1)/1.5 var(--en); letter-spacing: .18em; text-transform: uppercase; color: var(--terra-txt); }
h1 { font: 700 var(--f6)/1.25 var(--jp); letter-spacing: .08em; margin-top: 2px; }
.sub { margin: 4px 0 0; font-size: var(--f2); line-height: 1.8; max-width: 100ch; color: var(--ink); }
.sub em { font-style: normal; text-emphasis: filled dot var(--terra); -webkit-text-emphasis: filled dot var(--terra); text-emphasis-position: over right; -webkit-text-emphasis-position: over; }
.enlaces { display: flex; gap: 20px; align-items: center; }
.enlace-linea { font: 600 var(--f1)/1 var(--en); letter-spacing: .16em; text-transform: uppercase; text-decoration: none; padding: 10px 0; border-top: 1.5px solid var(--linea); border-bottom: 1.5px solid var(--linea); }
.enlace-linea:hover { color: var(--terra-txt); }
.circulo { width: 56px; height: 56px; border-radius: 50%; border: 1.5px solid var(--linea); background: transparent; font: 600 var(--f1) var(--en); letter-spacing: .14em; cursor: pointer; flex: none; }
@media (hover: hover) { .circulo:hover { background: var(--ink); color: var(--beige); } }
.circulo svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; display: block; margin: auto; }
.enlaces .botones { display: flex; gap: 10px; }
.motivo { height: 132px; background: var(--beige); overflow: hidden; }
.motivo svg { display: block; width: 100%; height: 100%; }

/* selector */
.selector { display: grid; gap: 6px; padding-top: 6px; padding-bottom: 14px; position: relative; z-index: 1; }
.grupo { display: flex; gap: 16px; align-items: baseline; min-width: 0; }
.glabel { font: 600 var(--f1)/1.3 var(--en); letter-spacing: .16em; text-transform: uppercase; flex: 0 0 9.5rem; color: var(--muted); }
.pills { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.pill, .mini-pills button {
  border: 1px solid var(--ctl); background: transparent; border-radius: var(--pill); padding: 1px 13px; min-height: 32px;
  font-size: var(--f2); font-weight: 500; cursor: pointer; line-height: 1.3; display: inline-flex; align-items: center; gap: 7px; color: var(--ink);
}
.pill:hover, .mini-pills button:hover { border-color: var(--ink); }
.pill[aria-pressed="true"], .mini-pills button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); font-weight: 700; }
.pill .dots { display: inline-flex; gap: 3px; }
.pill .dots i { width: 7px; height: 7px; display: block; }
.pill .dots .f { background: var(--fw); border-radius: 50%; } .pill .dots .b { background: var(--banc); }
.pill[aria-pressed="true"] .dots .b { background: var(--surface); }

/* ---------- primera pantalla */
.primera { display: grid; grid-template-columns: minmax(0, 2.15fr) minmax(18rem, 1fr); gap: 40px; padding-top: 14px; padding-bottom: 28px; }
.h2 { font: 600 var(--f4)/1.3 var(--en); letter-spacing: .14em; text-transform: uppercase; color: var(--terra-txt); }
.phead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
.leyenda { display: flex; gap: 18px; font-size: var(--f1); color: var(--muted); flex-wrap: wrap; letter-spacing: .04em; }
.leyenda span { display: inline-flex; gap: 7px; align-items: center; }
.leyenda svg { width: 14px; height: 14px; flex: none; }
.chart { position: relative; width: 100%; }
.chart > svg { display: block; width: 100%; overflow: visible; }
.chart text { fill: var(--muted); font: 500 12.8px var(--en); letter-spacing: .04em; font-variant-numeric: tabular-nums; }
.chart .lab { fill: var(--ink); font: 500 14px var(--jp); letter-spacing: .04em; }
.chart .grid { stroke: var(--hair); }
.chart .row { cursor: pointer; }
.chart .hit { fill: transparent; }
.chart .row:hover .hit, .chart .row.on .hit { fill: var(--block); }
.chart .row.on .lab { font-weight: 700; }
.pie-chart { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; margin-top: 8px; }
.escala { display: flex; align-items: center; gap: 10px; font: 500 var(--f1) var(--en); color: var(--muted); letter-spacing: .06em; }
.escala .cuadros { display: flex; outline: 1px solid var(--hair); }
.escala .cuadros i { width: 16px; height: 10px; display: block; }
.como { font-size: var(--f2); color: var(--muted); }
.como summary { cursor: pointer; width: fit-content; font: 600 var(--f1) var(--en); letter-spacing: .14em; text-transform: uppercase; }
.como p { margin: 6px 0 0; max-width: 72ch; line-height: 1.9; }

.esquinas { position: relative; }
.esquinas::before {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  --l: 14px; --g: 1.5px; --c: var(--ctl);
  background:
    linear-gradient(var(--c), var(--c)) top left / var(--l) var(--g), linear-gradient(var(--c), var(--c)) top left / var(--g) var(--l),
    linear-gradient(var(--c), var(--c)) top right / var(--l) var(--g), linear-gradient(var(--c), var(--c)) top right / var(--g) var(--l),
    linear-gradient(var(--c), var(--c)) bottom left / var(--l) var(--g), linear-gradient(var(--c), var(--c)) bottom left / var(--g) var(--l),
    linear-gradient(var(--c), var(--c)) bottom right / var(--l) var(--g), linear-gradient(var(--c), var(--c)) bottom right / var(--g) var(--l);
  background-repeat: no-repeat;
}
.mn { padding: 14px 20px 16px; align-self: start; margin-top: 4px; }
.mn .h2 { margin-bottom: 10px; }
.cifra { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.chip-capa { width: 14px; height: 40px; flex: none; }
.fig { font: 600 2.75rem/1 var(--en); letter-spacing: -.01em; }
.fig-l { font-size: var(--f2); max-width: 20ch; line-height: 1.5; }
.mnrows { margin-top: 12px; display: grid; }
.mnrow { display: grid; grid-template-columns: minmax(0, 1fr) 5rem 2.6rem; gap: 10px; align-items: center; font-size: var(--f2); padding: 5px 0; border-top: 1px solid var(--hair); line-height: 1.5; }
.mnrow .n { color: var(--muted); font-size: var(--f1); display: block; letter-spacing: .02em; }
.mnrow svg { width: 100%; height: 14px; display: block; }
.mnrow .v { font: 600 var(--f3) var(--en); text-align: right; font-variant-numeric: tabular-nums; }
.mnrow.na { color: var(--muted); }
.meta { margin: 14px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; font-size: var(--f1); line-height: 1.8; }
.meta dd { margin: 0; font: 600 var(--f2) var(--en); font-variant-numeric: tabular-nums; }

/* ---------- secciones a todo lo ancho */
.seccion { padding: 56px 0 56px; border-top: 1px solid var(--hair); }
.shead { text-align: center; display: grid; justify-items: center; gap: 10px; margin-bottom: 28px; }
.h2-grande { font: 600 var(--f6)/1.2 var(--en); letter-spacing: .1em; text-transform: uppercase; color: var(--terra); }
.lead { margin: 0; max-width: 70ch; font-size: var(--f2); line-height: 1.9; }
.veredicto { margin: 20px auto 0; max-width: 78ch; font-size: var(--f3); line-height: 1.9; text-align: center; }
.atajo .chart .banda { fill: var(--block); }

.dos-grid { display: grid; grid-template-columns: minmax(0, 480px) minmax(0, 1fr); gap: 48px; align-items: center; max-width: 1060px; margin-inline: auto; }
.scatter-wrap { position: relative; aspect-ratio: 1; width: 100%; max-width: 480px; padding: 10px; }
#dos-canvas { width: 100%; height: 100%; display: block; }
.dos-txt p { margin: 0 0 14px; max-width: 52ch; line-height: 1.9; }
.big-rho { display: flex; align-items: baseline; gap: 12px; }
.big-rho .fig { font-size: 4rem; color: var(--terra-txt); }
.mini-pills { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }

.filtros { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.campo { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--ctl); border-radius: var(--pill); background: var(--surface); padding: 0 16px; min-height: 40px; }
.campo input { border: 0; background: none; outline: none; width: 12rem; font-size: var(--f2); padding: 6px 0; }
.campo select { border: 0; background: none; font-size: var(--f2); padding: 6px 0; max-width: 15rem; }
.campo:focus-within { outline: 2px solid var(--ink); outline-offset: 2px; }
.ico { width: 16px; height: 16px; fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.tabla-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: var(--f2); }
th { text-align: left; font: 600 var(--f1) var(--en); letter-spacing: .14em; text-transform: uppercase; padding: 10px 14px 10px 0; border-bottom: 1.5px solid var(--linea); white-space: nowrap; color: var(--ink); }
td { padding: 7px 14px 7px 0; border-bottom: 1px solid var(--hair); vertical-align: middle; line-height: 1.5; }
tbody tr:hover td { background: var(--block); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
td.num { font: 600 var(--f2) var(--en); }
td .cap { display: inline-flex; align-items: center; gap: 8px; justify-content: flex-end; }
td .cap i { width: 10px; height: 10px; display: block; }
td.barra { width: 28%; min-width: 120px; }
td.barra svg { width: 100%; height: 12px; display: block; }
.mas { display: flex; justify-content: center; margin-top: 28px; }
.mas button { border: 0; border-top: 1.5px solid var(--linea); border-bottom: 1.5px solid var(--linea); background: none; padding: 12px 48px; min-height: 44px; cursor: pointer; font: 600 var(--f1) var(--en); letter-spacing: .18em; text-transform: uppercase; }
.mas button:hover { color: var(--terra-txt); }

.tip { position: fixed; z-index: 10; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--ink); border-radius: var(--r1); padding: 8px 10px; font-size: var(--f1); line-height: 1.6; max-width: 19rem; letter-spacing: .02em; }
.tip b { font-weight: 700; }
.tip .m { font-family: var(--en); font-variant-numeric: tabular-nums; }
.scatter-wrap .tip { position: absolute; }

/* ---------- pie */
.pie { background: var(--pie); color: var(--pie-txt); padding: 48px 0 56px; }
.pie-marca { margin: 0; text-align: center; font: 700 var(--f5) var(--jp); letter-spacing: .1em; color: #ffffff; }
.pie-sub { margin: 4px 0 28px; text-align: center; font: 600 var(--f1) var(--en); letter-spacing: .2em; }
.pie ul { list-style: none; margin: 0 auto; padding: 24px 0 0; border-top: 1px solid rgba(229, 220, 210, .25); display: grid; gap: 10px; max-width: 92ch; }
.pie li { position: relative; padding-left: 20px; font-size: var(--f2); line-height: 1.9; }
.pie li::before { content: ""; position: absolute; left: 2px; top: .72em; width: 7px; height: 7px; background: var(--rombo); transform: rotate(45deg); }
.pie a { color: #ffffff; }

@media (max-width: 960px) {
  .primera { grid-template-columns: 1fr; gap: 24px; }
  .dos-grid { grid-template-columns: 1fr; gap: 24px; }
}
@media (max-width: 600px) {
  .top { grid-template-columns: auto minmax(0, 1fr); gap: 12px; padding-top: 14px; }
  .enlaces { grid-column: 1 / -1; justify-content: space-between; }
  .sello { width: 64px; height: 64px; }
  .sello text { font-size: 12.5px; }
  h1 { font-size: var(--f5); letter-spacing: .05em; }
  .sub { font-size: var(--f1); }
  .grupo { flex-direction: column; gap: 6px; align-items: stretch; }
  .glabel { flex: none; }
  .pills { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; max-width: 100%; }
  .pill, .mini-pills button { white-space: nowrap; min-height: 40px; }
  .circulo { width: 48px; height: 48px; }
  .mn { padding: 14px 14px 16px; }
  .seccion { padding: 40px 0; }
  .h2-grande { font-size: var(--f5); }
  .campo input { width: 9rem; }
  .fig { font-size: 2.25rem; }
  .big-rho .fig { font-size: 3rem; }
  td.barra { display: none; }
  .motivo { height: 96px; }
}
.sello-centro rect { animation: pulso 2.4s ease-in-out infinite; }
.sello-centro rect:nth-child(1) { animation-delay: 0s; } .sello-centro rect:nth-child(2) { animation-delay: .12s; }
.sello-centro rect:nth-child(4) { animation-delay: .12s; } .sello-centro rect:nth-child(5) { animation-delay: .24s; }
.sello-centro rect:nth-child(3) { animation-delay: .24s; } .sello-centro rect:nth-child(7) { animation-delay: .24s; }
.sello-centro rect:nth-child(6) { animation-delay: .36s; } .sello-centro rect:nth-child(8) { animation-delay: .36s; }
.sello-centro rect:nth-child(9) { animation-delay: .48s; }
@keyframes pulso { 0%, 60%, 100% { opacity: 1; } 30% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .sello svg, .sello-centro rect { animation: none !important; } }

</style>
</head>
<body>
<div class="banda-top">
  <header class="top envoltura">
    <div class="sello" aria-hidden="true">
      <svg viewBox="0 0 120 120"><defs><path id="circ" d="M60,60 m-46,0 a46,46 0 1,1 92,0 a46,46 0 1,1 -92,0"/></defs>
        <text><textPath href="#circ" textLength="286" lengthAdjust="spacing">FLY SENSORY LAYERS · FLYWIRE · BANC · </textPath></text>
        <g class="sello-centro"><rect x="42.0" y="42.0" width="11" height="11" fill="var(--c1)"/><rect x="54.5" y="42.0" width="11" height="11" fill="var(--c2)"/><rect x="67.0" y="42.0" width="11" height="11" fill="var(--c3)"/><rect x="42.0" y="54.5" width="11" height="11" fill="var(--c4)"/><rect x="54.5" y="54.5" width="11" height="11" fill="var(--c5)"/><rect x="67.0" y="54.5" width="11" height="11" fill="var(--c6)"/><rect x="42.0" y="67.0" width="11" height="11" fill="var(--c7)"/><rect x="54.5" y="67.0" width="11" height="11" fill="var(--c8)"/><rect x="67.0" y="67.0" width="11" height="11" fill="var(--c9)"/></g></svg>
    </div>
    <div class="titulo">
      <p class="kicker" data-t="kicker"></p>
      <h1 data-t="titulo">capas sensoriales de la mosca</h1>
      <p class="sub" id="sub"></p>
    </div>
    <nav class="enlaces">
      <a class="enlace-linea" href="https://github.com/Quiwitl/fly-sensory-layers" data-t="repo">código e informe</a>
      <div class="botones">
        <button type="button" class="circulo" id="modo"></button>
        <button type="button" class="circulo" id="lang" aria-label="English">EN</button>
      </div>
    </nav>
  </header>

  <section class="selector envoltura" aria-labelledby="sel-t">
    <h2 id="sel-t" class="vh" data-t="elige"></h2>
    <div class="grupo"><span class="glabel" data-t="g_cabeza"></span><div class="pills" id="pills-cabeza"></div></div>
    <div class="grupo"><span class="glabel" data-t="g_patas"></span><div class="pills" id="pills-patas"></div></div>
  </section>
</div>

<main id="main" aria-busy="true">
  <div class="primera envoltura">
    <section class="panel sc" aria-labelledby="sc-t">
      <div class="phead">
        <h2 id="sc-t" class="h2" data-t="sc_t"></h2>
        <div class="leyenda" id="leyenda"></div>
      </div>
      <div id="sc-chart" class="chart" role="img"></div>
      <div class="pie-chart">

function modoActual() {
  const r = document.documentElement;
  if (r.dataset.modo === "light" || r.dataset.modo === "dark") return r.dataset.modo;
  if (r.dataset.theme === "light" || r.dataset.theme === "dark") return r.dataset.theme;
  return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function botonModo() {
  const oscuro = modoActual() === "dark", b = $("#modo");

const colorCapa = (v) => `var(--c${Math.max(1, Math.min(11, Math.round(v)))})`;

let ondaFase = 0, ondaTimer = 0, ondaVisible = false;
function motivo() {
  // anillos que se propagan desde dos semillas con los colores de la escala de capas; los colores avanzan hacia afuera
  const svg = $("#motivo"), W = 1600, H = 132;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  let s = "";
  for (const [cx, cy, paso] of [[260, 150, 0], [1180, -30, 3]]) {
    for (let k = 11; k >= 1; k--) {
      const r = 22 + k * 30;
      s += `<circle class="onda" data-k="${k}" data-p="${paso}" cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--c${((k + paso - 1) % 11) + 1})" stroke-width="22"/>`;
      s += `<circle cx="${cx}" cy="${cy}" r="${r + 12}" fill="none" stroke="var(--beige)" stroke-width="2.5"/>`;
    }
    s += `<circle cx="${cx}" cy="${cy}" r="30" fill="var(--c1)"/>`;
  }
  svg.innerHTML = s;
  const ondas = [...svg.querySelectorAll(".onda")];
  const pintar = () => { for (const o of ondas) o.setAttribute("stroke", `var(--c${((+o.dataset.k + +o.dataset.p - 1 - ondaFase) % 11 + 11) % 11 + 1})`); };
  const correr = () => {
    clearInterval(ondaTimer);
    if (!ondaVisible || document.hidden || sinMov()) return;
    ondaTimer = setInterval(() => { ondaFase = (ondaFase + 1) % 11; pintar(); }, 260);
  };
  new IntersectionObserver((e) => { ondaVisible = e[0].isIntersecting; correr(); }).observe(svg);
  document.addEventListener("visibilitychange", correr);
  matchMedia("(prefers-reduced-motion: reduce)").addEventListener("change", correr);
}

// ---------- selector
function pills() {
  for (const g of ["cabeza", "patas"]) {
    const cont = $(`#pills-${g}`);
    cont.innerHTML = "";
    for (const [m, grupo] of MODS) {
      if (grupo !== g) continue;
      const b = document.createElement("button");
      b.type = "button"; b.className = "pill"; b.dataset.mod = m;
      b.setAttribute("aria-pressed", String(m === mod));
      const f = !!D.fw_superclases[m], k = !!D.banc_superclases[m];
      b.innerHTML = `${esc(L().mods[m])}<span class="dots" aria-hidden="true">${f ? '<i class="f"></i>' : ""}${k ? '<i class="b"></i>' : ""}</span>`;
      b.title = [f ? "FlyWire" : "", k ? "BANC" : ""].filter(Boolean).join(" + ");
      b.addEventListener("click", () => elegir(m, true));
      cont.appendChild(b);
    }
  }
}

function elegir(m, desdeClic) {
  mod = m;
  if (H2_MODS.includes(m)) h2mod = m;
  scFiltro = ""; pagina = 15;
  if (desdeClic && location.hash !== "#" + hashDe(m)) history.replaceState(null, "", "#" + hashDe(m));
  document.querySelectorAll(".pill").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.mod === m)));
  todo(true);
}

const tip = $("#tip");
function mostrarTip(html, ev) {

// ---------- capa por superclase
function filasSC(m) {
  const filas = {};
  for (const [src, clave] of [["fw", "fw_superclases"], ["banc", "banc_superclases"]]) {
    for (const r of D[clave][m] || []) {
      const id = SC[r.sc];
      if (!id || r.n < 20) continue;
      (filas[id] ||= { id })[src] = r;
    }
  }
  return Object.values(filas).sort((a, b) => Math.min(a.fw?.med ?? 99, a.banc?.med ?? 99) - Math.min(b.fw?.med ?? 99, b.banc?.med ?? 99));
}

const sinMov = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
let animSC = 0;
const DUR_FRENTE = 1800, curva = (p) => 0.5 - 0.5 * Math.cos(Math.PI * p);   // entra y sale suave
function chartSC(animar = false) {
  const cont = $("#sc-chart");
  const filas = filasSC(mod);
  const W = Math.max(300, cont.clientWidth), estrecho = W < 520;
  const izq = estrecho ? 0 : 172, der = 36, arriba = 22, alto = estrecho ? 42 : 30, dy = estrecho ? 8 : 0;
  const H = arriba + filas.length * alto + 8;
  const x = (v) => izq + ((v - XMIN) / (XMAX - XMIN)) * (W - izq - der);
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, height: H });
  const defs = el("defs", {}, svg), clip = el("clipPath", { id: "frente-clip" }, defs);
  const clipR = el("rect", { x: 0, y: 0, width: W, height: H }, clip);
  for (let t = XMIN; t <= XMAX; t++) {
    el("line", { x1: x(t), x2: x(t), y1: arriba - 4, y2: H - 4, class: "grid" }, svg);
    const tx = el("text", { x: x(t), y: 12, "text-anchor": "middle" }, svg); tx.textContent = t;
  }
  if (!estrecho) { const tcap = el("text", { x: izq - 8, y: 12, "text-anchor": "end" }, svg); tcap.textContent = lang === "es" ? "capa" : "layer"; }
  const valores = [];
  filas.forEach((f, i) => {
    const y0 = arriba + i * alto;
    const g = el("g", { class: "row" + (scFiltro === f.id ? " on" : ""), tabindex: 0, role: "button" }, svg);
    el("rect", { x: 0, y: y0, width: W, height: alto, class: "hit" }, g);
    const lab = el("text", { x: 0, y: estrecho ? y0 + 14 : y0 + alto / 2 + 5, class: "lab" }, g); lab.textContent = L().sc[f.id];
    const series = [["fw", "var(--fw)"], ["banc", "var(--banc)"]].filter(([s]) => f[s]);
    const gd = el("g", { "clip-path": "url(#frente-clip)" }, g);
    series.forEach(([s, color], j) => {
      const r = f[s], yc = y0 + alto / 2 + dy + (series.length === 2 ? (j ? 5 : -5) : 0);
      el("line", { x1: x(r.q10), x2: x(r.q90), y1: yc, y2: yc, stroke: color, "stroke-width": 1.5 },gd);
      el("rect", { x: x(r.q25), y: yc - 4, width: Math.max(3, x(r.q75) - x(r.q25)), height: 8, fill: color, rx: 1 },gd);
      el("rect", { x: x(r.med) - 1.25, y: yc - 4, width: 2.5, height: 8, fill: "var(--mediana)" },gd);
      el("circle", { cx: x(r.med), cy: yc, r: 1.8, fill: color },gd);
    });
    const mv = Math.min(f.fw?.med ?? 99, f.banc?.med ?? 99);
    const v = el("text", { x: W, y: y0 + alto / 2 + dy + 5, "text-anchor": "end" }, g); v.textContent = fmt(mv);
    valores.push([v, mv]);
    const info = series.map(([s]) => (s === "fw" ? "FlyWire: " : "BANC: ") + L().tip_sc(L().sc[f.id], nf(f[s].n), [f[s].q10, f[s].q25, f[s].med, f[s].q75, f[s].q90].map((q) => fmt(q))));
    g.addEventListener("mousemove", (ev) => mostrarTip(info.join("<br>"), ev));
    g.addEventListener("mouseleave", ocultarTip);
    const act = () => { scFiltro = scFiltro === f.id ? "" : f.id; pagina = 15; chartSC(); tabla(); };
    g.addEventListener("click", act);
    g.addEventListener("keydown", (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); act(); } });
  });
  cont.replaceChildren(svg);
  cancelAnimationFrame(animSC);
  if (animar && !sinMov()) {
    // frente de propagación: avanza de la capa 1 a la 11 y descubre las barras a su paso
    const frente = el("g", { class: "frente" }, svg);
    const fl = el("line", { y1: arriba - 6, y2: H - 4, stroke: "var(--terra)", "stroke-width": 2 }, frente);

    const dur = DUR_FRENTE, t0 = performance.now();
    for (const [t] of valores) t.style.opacity = 0;
    const paso = (ahora) => {
      const p = Math.min(1, (ahora - t0) / dur), capa = XMIN + (XMAX - XMIN) * curva(p), fx = x(capa);
      clipR.setAttribute("width", Math.max(0, fx));
      fl.setAttribute("x1", fx); fl.setAttribute("x2", fx); fc.setAttribute("cx", fx);
      for (const [t, mv] of valores) if (mv <= capa) t.style.opacity = 1;
      if (p < 1) animSC = requestAnimationFrame(paso);
      else { clipR.setAttribute("width", W); frente.remove(); for (const [t] of valores) t.style.opacity = 1; }
    };
    clipR.setAttribute("width", 0);
    animSC = requestAnimationFrame(paso);
  }
  cont.setAttribute("aria-label", filas.map((f) => `${L().sc[f.id]} ${fmt(Math.min(f.fw?.med ?? 99, f.banc?.med ?? 99))}`).join(", "));
}

// ---------- atajo de las patas
// animación del atajo: estado global para que un redibujo a media animación siga donde iba
let filasAt = [], atajoPendiente = true, atajoT0 = 0, animAt = 0;
const AT_PASO = 300, AT_CARRERA = 1400, AT_DIF = 1000;
const lim = (v) => Math.max(0, Math.min(1, v));
function estadoAtajo(t) {
  for (const f of filasAt) {
    const tr = t - f.i * AT_PASO, a = f.a;
    const cur = 1 + 7 * curva(lim(tr / AT_CARRERA));
    const xp = f.xa(Math.min(a.pata, cur)), xc = f.xa(Math.min(a.cabeza, cur));
    f.pata.setAttribute("cx", xp); f.cab.setAttribute("x", xc - 5);
    f.lin.setAttribute("x1", xp); f.lin.setAttribute("x2", xc);
    f.txt.setAttribute("x", (xp + xc) / 2); f.txt.style.opacity = cur >= a.cabeza ? 1 : 0;
    const t2 = tr - AT_CARRERA;
    for (const z of f.azar) z.style.opacity = lim(t2 / 300);
    const pd = lim((t2 - 300) / (AT_DIF - 300));
    f.dif.setAttribute("cx", f.xb(a.dif * curva(pd))); f.dif.style.opacity = t2 >= 300 ? 1 : 0;
    if (f.ic) f.ic.style.opacity = pd >= 1 ? 1 : 0;
  }
}
function animarAtajo() {
  if (sinMov()) { atajoPendiente = false; estadoAtajo(Infinity); return; }
  atajoPendiente = false; atajoT0 = performance.now();
  const fin = (filasAt.length - 1) * AT_PASO + AT_CARRERA + AT_DIF;
  const paso = (ahora) => {
    const t = ahora - atajoT0;
    estadoAtajo(t);
    if (t < fin) animAt = requestAnimationFrame(paso); else estadoAtajo(Infinity);
  };
  cancelAnimationFrame(animAt); animAt = requestAnimationFrame(paso);
}

function chartAtajo() {
  const cont = $("#at-chart");
  const W = Math.max(300, cont.clientWidth), estrecho = W < 760;
  const segs = ["MN_T1", "MN_T2", "MN_T3"];

  const H = arriba + segs.length * alto + 10;
  const izq = estrecho ? 10 : 190;
  const anchoA = estrecho ? W : Math.round((W - izq) * 0.55);
  const x0 = izq, x1 = izq + anchoA - 24;
  const xa = (v) => x0 + ((v - 1) / (8 - 1)) * (x1 - x0);
  const b0 = estrecho ? 10 : izq + anchoA + 24, b1 = W - 16;
  const xb = (v) => b0 + ((v + 2.5) / (3 + 2.5)) * (b1 - b0);
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, height: H });
  const ejeA = el("text", { x: x0, y: 12 }, svg); ejeA.textContent = L().at_eje1;
  if (!estrecho) { const ejeB = el("text", { x: b0, y: 12 }, svg); ejeB.textContent = L().at_eje2; }
  let pasan = 0;
  filasAt = [];
  segs.forEach((s, i) => {
    const a = D.atajo[s]; if (!a) return;
    if (a.dif >= 2) pasan++;
    const y0 = arriba + i * alto;
    const ya = estrecho ? y0 + 34 : y0 + alto / 2 - 6;
    el("rect", { x: 0, y: y0 - 2, width: W, height: alto - 3, class: "banda" }, svg);
    const lab = el("text", { x: estrecho ? 10 : 16, y: estrecho ? y0 + 14 : ya + 5, class: "lab" }, svg);
    lab.textContent = L()["mn_" + s.slice(3)];
    for (let t = 1; t <= 8; t++) el("line", { x1: xa(t), x2: xa(t), y1: ya - 10, y2: ya + 10, class: "grid" }, svg);
    for (const t of [1, 4, 8]) { const tt = el("text", { x: xa(t), y: ya + 24, "text-anchor": "middle" }, svg); tt.textContent = t; }
    const lin = el("line", { x1: xa(a.pata), x2: xa(a.cabeza), y1: ya, y2: ya, stroke: "var(--ink)", "stroke-width": 2 }, svg);
    const cab = el("rect", { x: xa(a.cabeza) - 5, y: ya - 5, width: 10, height: 10, fill: "var(--ink)" }, svg);
    const pata = el("circle", { cx: xa(a.pata), cy: ya, r: 7, fill: "var(--pata)", stroke: "var(--ink)", "stroke-width": 1.5 }, svg);
    const td = el("text", { x: (xa(a.pata) + xa(a.cabeza)) / 2, y: ya - 10, "text-anchor": "middle" }, svg);
    td.textContent = `${fmt(a.dif, 2)} ${L().at_dif}`;
    td.setAttribute("fill", "var(--ink)");
    const yb = estrecho ? y0 + 70 : ya;
    for (let t = -2; t <= 3; t++) el("line", { x1: xb(t), x2: xb(t), y1: yb - 8, y2: yb + 8, class: "grid" }, svg);
    if (estrecho || i === segs.length - 1) for (const t of [-2, 0, 2]) { const tt = el("text", { x: xb(t), y: yb + 22, "text-anchor": "middle" }, svg); tt.textContent = t; }
    el("line", { x1: xb(0), x2: xb(0), y1: yb - 10, y2: yb + 10, stroke: "var(--muted)" }, svg);
    el("line", { x1: xb(2), x2: xb(2), y1: yb - 12, y2: yb + 12, stroke: "var(--ink)", "stroke-dasharray": "3 2" }, svg);
    const azar = a.azar.map((z) => el("circle", { cx: xb(z), cy: yb, r: 3.5, fill: "none", stroke: "var(--azar)", "stroke-width": 1.5 }, svg));
    const ic = a.ic95 && a.ic95[0] != null ? el("line", { x1: xb(a.ic95[0]), x2: xb(a.ic95[1]), y1: yb, y2: yb, stroke: "var(--pata)", "stroke-width": 2 }, svg) : null;
    const dif = el("circle", { cx: xb(a.dif), cy: yb, r: 7, fill: "var(--pata)", stroke: "var(--ink)", "stroke-width": 1.5 }, svg);
    filasAt.push({ i, a, xa, xb, lin, cab, pata, txt: td, azar, dif, ic });
    const hit = el("rect", { x: 0, y: y0, width: W, height: alto, fill: "transparent" }, svg);
    hit.addEventListener("mousemove", (ev) => mostrarTip(
      `<b>${esc(L()["mn_" + s.slice(3)])}</b><br><span class="m">${L().at_pata} ${fmt(a.pata, 2)} · ${L().at_cabeza} ${fmt(a.cabeza, 2)}<br>${lang === "es" ? "diferencia" : "difference"} ${fmt(a.dif, 2)} (IC95 ${fmt(a.ic95[0], 2)}–${fmt(a.ic95[1], 2)})<br>${L().at_azar}: ${fmt(Math.min(...a.azar), 2)} … ${fmt(Math.max(...a.azar), 2)}</span>`, ev));
    hit.addEventListener("mouseleave", ocultarTip);
  });

  if (atajoPendiente && !sinMov()) estadoAtajo(0);
  else if (atajoT0 && performance.now() - atajoT0 < 4000) estadoAtajo(performance.now() - atajoT0);
  const leyenda = document.createElement("div");
  leyenda.className = "leyenda"; leyenda.style.justifyContent = "center"; leyenda.style.marginTop = "14px";
  leyenda.innerHTML = `<span><svg viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="5.5" fill="var(--pata)" stroke="var(--ink)" stroke-width="1.5"/></svg>${L().at_pata}</span>`
    + `<span><svg viewBox="0 0 12 12" aria-hidden="true"><rect x="1" y="1" width="10" height="10" fill="var(--ink)"/></svg>${L().at_cabeza}</span>`
    + `<span><svg viewBox="0 0 12 12" aria-hidden="true"><circle cx="6" cy="6" r="4" fill="none" stroke="var(--azar)" stroke-width="1.5"/></svg>${L().at_azar}</span>`
    + `<span><svg viewBox="0 0 12 12" aria-hidden="true"><line x1="6" x2="6" y1="0" y2="12" stroke="var(--ink)" stroke-dasharray="3 2"/></svg>${L().at_crit}</span>`;
  cont.appendChild(leyenda);
  cont.setAttribute("aria-label", segs.map((s) => `${L()["mn_" + s.slice(3)]}: ${fmt(D.atajo[s].dif, 2)}`).join(", "));
  const nombres = segs.filter((s) => D.atajo[s].dif >= 2).map((s) => L()["mn_" + s.slice(3)]);
  $("#at-verdict").textContent = L().at_verdict(pasan === 3, nombres.length ? nombres.join(", ") : (lang === "es" ? "ninguna" : "none"));
}

// ---------- dos moscas
let puntos = [];
function scatter() {
  const m = H2_MODS.includes(mod) ? mod : h2mod;
  $("#dos-pills").innerHTML = H2_MODS.map((k) => `<button type="button" data-h2="${k}" aria-pressed="${k === m}">${esc(L().mods[k])}</button>`).join("");
  $("#dos-pills").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => { h2mod = b.dataset.h2; if (H2_MODS.includes(mod)) elegir(h2mod, true); else scatter(); }));
  const cv = $("#dos-canvas"), wrap = cv.parentElement;
  const S = wrap.clientWidth, dpr = window.devicePixelRatio || 1;
  cv.width = S * dpr; cv.height = S * dpr;
  const c = cv.getContext("2d"); c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const css = getComputedStyle(document.documentElement);
  const col = (v) => css.getPropertyValue(v).trim();
  const pad = 40, lo = 1, hi = 11;
  const sx = (v) => pad + ((v - lo) / (hi - lo)) * (S - pad - 10);
  const sy = (v) => S - pad - ((v - lo) / (hi - lo)) * (S - pad - 10);
  c.clearRect(0, 0, S, S);
  c.strokeStyle = col("--hair"); c.lineWidth = 1;
  c.font = `500 12.8px ${col("--en")}`; c.fillStyle = col("--muted");
  for (let t = 1; t <= 11; t += 2) {
    c.beginPath(); c.moveTo(sx(t), sy(lo)); c.lineTo(sx(t), sy(hi)); c.stroke();
    c.beginPath(); c.moveTo(sx(lo), sy(t)); c.lineTo(sx(hi), sy(t)); c.stroke();
    c.textAlign = "center"; c.fillText(t, sx(t), S - pad + 16);
    c.textAlign = "right"; c.fillText(t, pad - 6, sy(t) + 4);
  }
  c.strokeStyle = col("--muted"); c.setLineDash([3, 3]);
  c.beginPath(); c.moveTo(sx(lo), sy(lo)); c.lineTo(sx(hi), sy(hi)); c.stroke(); c.setLineDash([]);
  c.font = `500 14px ${col("--jp")}`; c.fillStyle = col("--ink"); c.textAlign = "center";
  c.fillText(L().eje_fw, sx(6), S - 6);
  c.save(); c.translate(12, sy(6)); c.rotate(-Math.PI / 2); c.fillText(L().eje_banc, 0, 0); c.restore();
  const X = D.h2.fw[m], Y = D.h2.banc[m];
  puntos = [];
  c.fillStyle = col("--terra"); c.globalAlpha = 0.5;
  for (let i = 0; i < X.length; i++) {
    if (X[i] == null || Y[i] == null) continue;
    const px = sx(X[i] / 100), py = sy(Y[i] / 100);
    puntos.push([px, py, i]);
    c.fillRect(px - 1.5, py - 1.5, 3, 3);
  }
  c.globalAlpha = 1;
  $("#dos-rho").textContent = D.h2.rho[m].toFixed(2);
  $("#dos-desc").textContent = L().dos_desc(L().modlargo[m], puntos.length);
  $("#dos-nota").textContent = H2_MODS.includes(mod) || !D.fw_superclases[mod] ? L().dos_nota : L().dos_nota_fw(L().mods[mod]);
  cv.setAttribute("aria-label", `${L().rho_l}: ${D.h2.rho[m].toFixed(3)}`);
  cv.onmousemove = (ev) => {
    const r = cv.getBoundingClientRect(), mx = ev.clientX - r.left, my = ev.clientY - r.top;
    let best = null, bd = 64;
    for (const p of puntos) { const d = (p[0] - mx) ** 2 + (p[1] - my) ** 2; if (d < bd) { bd = d; best = p; } }
    const t = $("#dos-tip");
    if (!best) { t.hidden = true; return; }
    const i = best[2];
    t.innerHTML = `<b>${esc(D.h2.tipos[i])}</b><br><span class="m">FlyWire ${fmt(X[i] / 100, 2)} · BANC ${fmt(Y[i] / 100, 2)}</span>`;
    t.hidden = false;
    t.style.left = Math.min(best[0] + 10, S - 150) + "px"; t.style.top = Math.max(best[1] - 44, 0) + "px";
  };
  cv.onmouseleave = () => { $("#dos-tip").hidden = true; };
}

// ---------- tipos celulares
function filasTipos() {
  const usarFw = !!D.fw_tipos.L10[mod];
  const fuente = usarFw ? D.fw_tipos : D.banc_tipos;
  const Lv = fuente.L10[mod];
  let bancPorTipo = null;
  if (usarFw && H2_MODS.includes(mod)) {
    bancPorTipo = new Map();
    D.h2.tipos.forEach((t, i) => { if (D.h2.banc[mod][i] != null) bancPorTipo.set(t, D.h2.banc[mod][i] / 100); });
  }
  const out = [];
  for (let i = 0; i < fuente.nombres.length; i++) {
    if (Lv[i] == null) continue;
    out.push({ t: fuente.nombres[i], sc: SC[fuente.sc[i]] || "", n: fuente.n[i], v: Lv[i] / 10, b: bancPorTipo ? bancPorTipo.get(fuente.nombres[i]) : undefined });
  }
  out.sort((a, b) => a.v - b.v);
  return { out, usarFw, conBanc: !!bancPorTipo };
}

function tabla() {
  const { out, usarFw, conBanc } = filasTipos();
  const sel = $("#fsc");
  const presentes = [...new Set(out.map((r) => r.sc).filter(Boolean))];
  sel.innerHTML = `<option value="">${esc(L().todas_sc)}</option>` + presentes.map((s) => `<option value="${s}">${esc(L().sc[s])}</option>`).join("");
  sel.value = presentes.includes(scFiltro) ? scFiltro : "";
  const q = $("#q").value.trim().toLowerCase();
  const f = out.filter((r) => (!sel.value || r.sc === sel.value) && (!q || r.t.toLowerCase().includes(q)));
  const vis = f.slice(0, pagina);
  const col1 = usarFw ? L().th_fw : L().th_banc;
  $("#tabla thead").innerHTML = `<tr><th>${L().th_tipo}</th><th>${L().th_sc}</th><th class="num">${L().th_n}</th><th class="num">${col1}</th>${conBanc ? `<th class="num">${L().th_banc}</th>` : ""}<th><span class="vh">${lang === "es" ? "capa" : "layer"}</span></th></tr>`;
  const w = 200, x = (v) => ((v - XMIN) / (XMAX - XMIN)) * w;
  const c1 = usarFw ? "var(--fw)" : "var(--banc)";
  $("#tabla tbody").innerHTML = vis.map((r) => `<tr><td>${esc(r.t)}</td><td>${esc(L().sc[r.sc] || "–")}</td><td class="num">${nf(r.n)}</td><td class="num"><span class="cap"><i style="background:${colorCapa(r.v)}"></i>${fmt(r.v)}</span></td>${conBanc ? `<td class="num">${r.b == null ? "–" : `<span class="cap"><i style="background:${colorCapa(r.b)}"></i>${fmt(r.b)}</span>`}</td>` : ""}`
    + `<td class="barra"><svg viewBox="0 0 ${w} 12" preserveAspectRatio="none" aria-hidden="true"><line x1="0" x2="${w}" y1="6" y2="6" stroke="var(--hair)"/><rect x="0" y="${conBanc ? 1 : 3}" width="${Math.max(1, x(r.v))}" height="${conBanc ? 4 : 6}" fill="${c1}"/>${conBanc && r.b != null ? `<rect x="0" y="7" width="${Math.max(1, x(r.b))}" height="4" fill="var(--banc)"/>` : ""}</svg></td></tr>`).join("");
  $("#mas").hidden = f.length <= pagina;
  $("#cuenta").textContent = L().cuenta(vis.length, f.length);
}

// ---------- todo
function todo(animar = false) {
  chartSC(animar); panelMN(animar); chartAtajo(); scatter(); tabla();
}

async function inicio() {
  const pref = leer("capas-lang");
  lang = pref === "en" || pref === "es" ? pref : ((navigator.language || "es").toLowerCase().startsWith("es") ? "es" : "en");
  textos();
  try {
    const r = await fetch("data.json");
    if (!r.ok) throw new Error(r.status);
    D = await r.json();
  } catch (e) {
    $("#main").innerHTML = `<p class="nota" role="alert">${esc(L().error)}</p>`;
    return;
  }
  mod = modDeHash(location.hash) || "olfativas";
  if (H2_MODS.includes(mod)) h2mod = mod;
  pills(); todo(true); motivo();
  new IntersectionObserver((e, obs) => { if (e[0].isIntersecting && atajoPendiente) { obs.disconnect(); animarAtajo(); } },
    { rootMargin: "0px 0px -20% 0px" }).observe($("#at-chart"));
  $("#main").setAttribute("aria-busy", "false");
  $("#modo").addEventListener("click", () => {
    const nuevo = modoActual() === "dark" ? "light" : "dark";
    document.documentElement.dataset.modo = nuevo; guardar("capas-modo", nuevo); botonModo();
  });
  $("#lang").addEventListener("click", () => {
    lang = lang === "es" ? "en" : "es"; guardar("capas-lang", lang); textos(); pills(); todo(); $("#lang").focus();
  });
  $("#q").addEventListener("input", () => { pagina = 15; tabla(); });
  $("#fsc").addEventListener("change", () => { scFiltro = $("#fsc").value; pagina = 15; chartSC(); tabla(); });
  $("#mas").addEventListener("click", () => { pagina += 40; tabla(); });
  addEventListener("hashchange", () => { const m = modDeHash(location.hash); if (m && m !== mod) elegir(m, false); });
  let rt = 0, ancho = $("#main").clientWidth;
  new ResizeObserver(() => {
    const w = $("#main").clientWidth;
    if (w === ancho) return;
    ancho = w; cancelAnimationFrame(rt); rt = requestAnimationFrame(() => { chartSC(); chartAtajo(); scatter(); });
  }).observe($("#main"));
  const alCambiarTema = () => { scatter(); botonModo(); };
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", alCambiarTema);
  new MutationObserver(alCambiarTema).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme", "data-modo"] });
}
inicio();

</script>
